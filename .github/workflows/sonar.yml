name: Python Tests and SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install numpy pandas matplotlib seaborn
          python -m pip install scikit-learn
          python -m pip install xgboost lightgbm catboost shap
          python -m pip install joblib openpyxl
          python -m pip install pytest coverage

      - name: Run tests and generate coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -v
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      - name: Verify coverage file
        run: |
          echo "Checking project files..."
          ls -la

          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not created"
            exit 1
          fi

          echo "coverage.xml created successfully"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
